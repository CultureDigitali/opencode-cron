<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ocTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c7866"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0c7866" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Astrolabe Precision Ring -->
  <circle cx="256" cy="256" r="236" stroke="currentColor" stroke-width="5" stroke-opacity="0.9"/>
  <circle cx="256" cy="256" r="222" stroke="currentColor" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="206" stroke="currentColor" stroke-width="3" stroke-opacity="0.75"/>

  <!-- Orbital Track Dashes & Degree Ticks -->
  <circle cx="256" cy="256" r="188" stroke="currentColor" stroke-width="1.5" stroke-dasharray="4 8" stroke-opacity="0.5"/>
  <circle cx="256" cy="256" r="162" stroke="currentColor" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Cardinal Axes Lines (12, 3, 6, 9) -->
  <line x1="256" y1="20" x2="256" y2="492" stroke="currentColor" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="20" y1="256" x2="492" y2="256" stroke="currentColor" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Compass / Chronometer Arrow Points -->
  <polygon points="256,32 250,72 262,72" fill="currentColor"/>
  <polygon points="256,480 250,440 262,440" fill="currentColor"/>
  <polygon points="32,256 72,250 72,262" fill="currentColor"/>
  <polygon points="480,256 440,250 440,262" fill="currentColor"/>

  <!-- Astrolabe Intersecting Arcs (Almucantar circles) -->
  <path d="M 94,256 A 162,162 0 0,1 418,256" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/>
  <path d="M 126,256 A 130,130 0 0,1 386,256" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3"/>
  <path d="M 256,94 A 162,162 0 0,1 256,418" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/>
  <path d="M 256,126 A 130,130 0 0,1 256,386" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Inner Gear Ring -->
  <circle cx="256" cy="256" r="118" stroke="url(#ocTealGrad)" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="102" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Neural Agent Hexagon Core -->
  <polygon points="256,170 330,213 330,299 256,342 182,299 182,213" fill="url(#ocTealGrad)" filter="url(#subtleGlow)"/>
  <polygon points="256,186 316,221 316,291 256,326 196,291 196,221" fill="#191919"/>

  <!-- Precision Chronometer Hand (45° angle) -->
  <line x1="256" y1="256" x2="352" y2="160" stroke="#f4f4f0" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="352" y2="160" stroke="#14b8a6" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="352,160 336,166 346,176" fill="#14b8a6"/>

  <!-- Central Pivot Bead -->
  <circle cx="256" cy="256" r="16" fill="#191919" stroke="#14b8a6" stroke-width="4"/>
  <circle cx="256" cy="256" r="6" fill="#f4f4f0"/>
</svg>

