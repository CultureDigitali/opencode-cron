name: Desktop Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            artifacts: "release/*.dmg, release/*.zip"
          - os: windows-latest
            target: win
            artifacts: "release/*.exe"
          - os: ubuntu-latest
            target: linux
            artifacts: "release/*.AppImage, release/*.deb"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: bun install

      - name: Build Core Application
        run: bun run build

      - name: Run Test Suite & Typecheck
        run: |
          bun run typecheck
          bun test

      - name: Build Electron Desktop Packages (${{ matrix.target }})
        run: |
          if [ "${{ matrix.target }}" = "mac" ]; then
            npx electron-builder --mac --publish never
          elif [ "${{ matrix.target }}" = "win" ]; then
            npx electron-builder --win --publish never
          else
            npx electron-builder --linux --publish never
          fi
        shell: bash

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opencode-cron-${{ matrix.target }}
          path: release/*.*
          if-no-files-found: warn

  # Single publisher: the three matrix jobs run in parallel and used to publish
  # to the same GitHub release concurrently, which raced (404 on release assets
  # and duplicate uploads). One job now collects every artifact and publishes once.
  publish-release:
    name: Publish Release Assets to GitHub
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: opencode-cron-*
          path: release
          merge-multiple: true

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.*
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

