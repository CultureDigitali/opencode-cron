<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>404 — Page not found · opencode-cron</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="/opencode-cron/assets/css/styles.css" />
<style>
  .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
  .nf h1 { font-family: var(--font-display); font-size: clamp(56px,14vw,140px); margin: 0; line-height: 1;
           background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nf p { color: var(--muted); max-width: 520px; margin: 14px auto 26px; }
</style>
</head>
<body>
<div class="bg-grid"></div><div class="bg-fx"></div>
<main class="nf">
  <div>
    <h1>404</h1>
    <p data-i18n="nf.text">This scheduled job never fired — the page you were looking for doesn’t exist.</p>
    <a class="btn btn-primary" href="/opencode-cron/" data-i18n="nf.back">← Back to the launch page</a>
  </div>
</main>
<script src="/opencode-cron/assets/js/i18n.js"></script>
<script src="/opencode-cron/assets/js/config.js"></script>
<script>
  // Apply the localized 404 strings using the shared i18n engine.
  (function () {
    var lang = (window.OC_I18N && window.OC_I18N.detect) ? window.OC_I18N.detect() : "en";
    var t = ((window.OC_I18N && window.OC_I18N.dict) || {})[lang] || {};
    t = t.nf || {};
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var k = el.getAttribute("data-i18n").split(".").pop();
      if (t[k]) el.textContent = t[k];
    });
  })();
</script>
</body>
</html>
